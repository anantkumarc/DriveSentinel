schema_version: 1
experiment_id: full_pipeline_research

camera:
  source: 0
  width: 640
  height: 480
  # Set to the device name shown by the operating system; OpenCV reports only an index.
  label: null

face:
  model: models/face_landmarker.task
  min_face_detection_confidence: 0.5
  min_face_presence_confidence: 0.5
  min_face_tracking_confidence: 0.5
  min_eye_width_px: 12

eyes:
  # Every numerical value here is a provisional engineering fixture.
  ear_closed_threshold: 0.20
  threshold_mode: fixed
  personal_calibration_duration_seconds: 20.0
  personal_calibration_closed_ratio: 0.70
  personal_calibration_min_samples: 50
  personal_calibration_min_open_ear: 0.12
  personal_calibration_max_open_ear: 0.55
  personal_calibration_max_relative_mad: 0.20
  quality_max_relative_asymmetry: 0.40
  critical_closure_seconds: 1.5
  max_sample_gap_seconds: 0.25
  capture_unavailable_after_seconds: 1.0
  perclos_window_seconds: 60.0
  perclos_min_coverage: 0.5

mouth:
  enabled: true
  open_ratio_threshold: 0.55
  min_mouth_width_px: 12
  candidate_after_seconds: 1.0
  max_sample_gap_seconds: 0.25

head_pose:
  enabled: true
  camera_calibration: configs/camera_calibration.json
  neutral_reference: configs/head_pose_neutral.json
  max_reprojection_error_px: 12.0
  neutral_calibration_seconds: 2.0
  yaw_deviation_degrees: 20.0
  pitch_deviation_degrees: 15.0

head_distraction:
  enabled: true
  left_yaw_threshold_deg: 15.0
  right_yaw_threshold_deg: 15.0
  downward_pitch_threshold_deg: 18.0
  head_turn_threshold_seconds: 5.0
  downward_head_threshold_seconds: 3.0
  left_yaw_recovery_threshold_deg: 10.0
  right_yaw_recovery_threshold_deg: 10.0
  downward_pitch_recovery_threshold_deg: 12.0
  angle_smoothing_time_constant_seconds: 0.15
  # Clear on the first valid forward sample after a sustained warning.
  recovery_duration_seconds: 0.0
  max_sample_gap_seconds: 0.5
  # FaceLandmarker applies this score gate internally but does not expose the
  # per-frame detector score in its Python result object.
  minimum_detection_confidence: 0.5
  # These signs are measured from the unmirrored inference image and the
  # driver's neutral head frame. Invert both only if the camera supplies a
  # horizontally mirrored image.
  left_yaw_sign: -1
  right_yaw_sign: 1
  # This camera's observed downward movement produces positive relative pitch.
  downward_pitch_sign: 1

phone:
  enabled: true
  backend: mediapipe
  model: models/efficientdet_lite0.tflite
  score_threshold: 0.20
  inference_interval_seconds: 0.2

hands:
  enabled: true
  model: models/hand_landmarker.task
  inference_interval_seconds: 0.1

interaction:
  # Broad initial ROI; narrow this to the driver's visible area if needed.
  driver_roi: [0.0, 0.0, 1.0, 1.0]
  proximity_fraction: 0.14
  association_validated: false

fusion:
  method: rules
  max_evidence_age_seconds: 1.0
  channels:
    # Sustained mouth opening is only a yawn-like candidate, not a yawn classifier.
    use_mouth: true
    use_head: false
    use_head_distraction: true
    # The supplied camera is a single-driver view; a phone detected anywhere
    # inside its configured driver ROI warns even when hand tracking misses.
    alert_on_phone_presence: true
  rules:
    drowsiness:
      eye_closure_fraction: 0.5
      perclos: 0.30
      yawn_candidate: 1.0
      head_deviation: 0.8
    distraction:
      sustained_head_distraction: 1.0
  weighted:
    drowsiness:
      weights:
        eye_closure_fraction: 0.4
        perclos: 0.4
        yawn_candidate: 0.1
        head_deviation: 0.1
      elevated_threshold: 0.4
      high_threshold: 0.75
      min_weight_coverage: 0.4
    distraction:
      weights:
        sustained_head_distraction: 1.0
      elevated_threshold: 0.4
      high_threshold: 0.75
      min_weight_coverage: 0.5
  calibrated:
    drowsiness: models/fusion_drowsiness.json
    distraction: models/fusion_distraction.json

alerts:
  entry_persistence_seconds: 0.0
  distraction_entry_persistence_seconds: 0.0
  # Confirm phone detections briefly to suppress one-frame false positives;
  # head-turn and downward-look timers remain controlled by head_distraction.
  phone_presence_entry_persistence_seconds: 1.0
  phone_presence_recovery_persistence_seconds: 0.5
  # Briefly bridge detector dropouts for non-head evidence; sustained head
  # warnings clear immediately through the head-specific recovery override.
  recovery_persistence_seconds: 1.5
  repeat_cooldown_seconds: 8.0
  max_sample_gap_seconds: 0.25
  audio_enabled: true
  buzzer_frequency_hz: 2400.0
  buzzer_sample_rate_hz: 48000
  buzzer_volume: 0.9
  audio_blocksize: 512

ui:
  show_preview: true

privacy:
  record_raw_video: false
  record_audio: false
  record_landmarks: false
  log_phone_boxes: false
