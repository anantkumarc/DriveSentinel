[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-monitoring-prototype"
version = "0.1.0"
description = "Local modular driver drowsiness and distraction research prototype"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mediapipe==1.2.0",
    "opencv-contrib-python>=4.13,<5",
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
    "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
phone = ["onnxruntime>=1.19,<2"]
training = ["scikit-learn>=1.4,<2", "pandas>=2.1,<4"]
resources = ["psutil>=5.9,<8"]

[project.scripts]
drive = "dms.launcher:main"
dms = "dms.app:main"
dms-camera-probe = "dms.tools.camera_probe:main"
dms-camera-calibrate = "dms.tools.calibrate_camera:main"
dms-pose-calibrate = "dms.tools.calibrate_head_neutral:main"

[tool.setuptools.packages.find]
where = ["src"]
